<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Kitchen Cost Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#0f766e;--pri2:#115e59;--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--bad:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit}
.shell{display:flex;min-height:100vh}
.side{width:230px;background:#0b3b38;color:#fff;padding:12px;flex-shrink:0}
.side h2{font-size:18px;margin:6px 8px 14px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;color:#cbd5e1;border-radius:10px;cursor:pointer;text-align:start}
.nav.on,.nav:hover{background:rgba(255,255,255,.12);color:#fff}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
#menuBtn{display:none}
.content{padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:26px;color:var(--pri)}
.stat span{color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar h1{font-size:20px;margin:0;flex:1}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--pri2)}
.btn.g{background:#e2e8f0;color:var(--tx)}
.btn.s{padding:4px 10px;font-size:13px}
input,select,textarea{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%;background:#fff}
input[type=checkbox]{width:auto}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
.tag{padding:2px 8px;border-radius:999px;font-size:12px;background:#dcfce7;color:#166534}
.tag.off{background:#fee2e2;color:#991b1b}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.md{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.fl{margin-bottom:10px}.fl label{display:block;margin-bottom:4px;color:var(--mu);font-size:13px}
.toast{position:fixed;bottom:16px;inset-inline:16px;max-width:420px;margin-inline:auto;background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;z-index:30}
.toast.err{background:var(--bad)}
.auth{max-width:380px;margin:8vh auto;padding:0 16px}
pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:8px;border-radius:8px;font-size:12px;direction:ltr;text-align:left}
@media(max-width:800px){
 .side{position:fixed;inset-block:0;inset-inline-start:0;z-index:15;transform:translateX(100%);transition:.2s}
 [dir=ltr] .side{transform:translateX(-100%)}
 .side.open{transform:none!important}
 #menuBtn{display:inline-block}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
